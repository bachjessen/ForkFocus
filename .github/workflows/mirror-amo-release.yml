name: Monitor SocialFocus upstream
"on":
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
permissions:
  contents: read
  issues: write
concurrency:
  group: monitor-socialfocus-upstream
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check public SocialFocus release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check-socialfocus-upstream.py
